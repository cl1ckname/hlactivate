[package]
name = "hlactivate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
cosmic-text = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false }
toml = "1.1.8"
wayland-client = "0.31.15"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
